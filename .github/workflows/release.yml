name: release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

env:
  BUILD_TYPE: Release

jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest]
        include:
          - os: windows-latest
            windows-arch: x64
          - os: windows-latest
            windows-arch: Win32

    runs-on: ${{matrix.os}}

    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    # This isn't working currently, see https://github.com/actions/checkout/issues/1467.
    # Instead, get the git information manually with the step below.
    #   with:
    #     fetch-tags: true

    - name: Refresh Git Information
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
          git fetch --force --tags
          git checkout "${GITHUB_REF_NAME}"

    - name: Create Build Directory
      run: cmake -E make_directory ./build

    - name: Run CMake
      shell: bash
      working-directory: ./build
      run: |
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          cmake -DENABLE_CLILOADER=1 -DCMAKE_BUILD_TYPE=$BUILD_TYPE -A ${{ matrix.windows-arch }} $GITHUB_WORKSPACE
        else
          cmake -DENABLE_CLILOADER=1 -DCMAKE_BUILD_TYPE=$BUILD_TYPE                               $GITHUB_WORKSPACE
        fi

    - name: Build
      working-directory: ./build
      shell: bash
      run: cmake --build . --parallel --config $BUILD_TYPE --target package

    - name: Update Python (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'

    - name: Sign (Windows zip)
      if: |
        startsWith(github.ref, 'refs/tags/') &&
        matrix.os == 'windows-latest'
      uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 #v3.4.0
      with:
        inputs: |
          ./build/clintercept-*.zip

    - name: Sign (Linux tgz)
      if: |
        startsWith(github.ref, 'refs/tags/') &&
        matrix.os == 'ubuntu-latest'
      uses: sigstore/gh-action-sigstore-python@5b79a39c381910c090341a2c9b0bf022c8b387e1 #v3.4.0
      with:
        inputs: |
          ./build/clintercept-*.tar.gz

    - name: Release (Windows zip)
      if: |
        startsWith(github.ref, 'refs/tags/') &&
        matrix.os == 'windows-latest'
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
      with:
        draft: true
        files: |
          ./build/clintercept-*.zip
          ./build/clintercept-*.zip.sigstore.json

    - name: Release (Linux tgz)
      if: |
        startsWith(github.ref, 'refs/tags/') &&
        matrix.os == 'ubuntu-latest'
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
      with:
        draft: true
        files: |
          ./build/clintercept-*.tar.gz
          ./build/clintercept-*.tar.gz.sigstore.json
