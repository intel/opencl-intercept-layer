name: release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        include:
          - os: windows-latest
            windows-arch: x64
          - os: windows-latest
            windows-arch: Win32
          - os: windows-11-arm
            windows-arch: ARM64
          - os: windows-11-arm
            windows-arch: ARM64EC

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    # This isn't working currently, see https://github.com/actions/checkout/issues/1467.
    # Instead, get the git information manually with the step below.
    #   with:
    #     fetch-tags: true

    - name: Refresh Git Information
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
          git fetch --force --tags
          git checkout "${GITHUB_REF_NAME}"

    - name: Create Build Directory
      run: cmake -E make_directory ./build

    - name: Run CMake
      shell: bash
      working-directory: ./build
      run: |
        if [[ -n "${{ matrix.windows-arch }}" ]]; then
          cmake -DENABLE_CLILOADER=1 -DCMAKE_BUILD_TYPE=$BUILD_TYPE -A ${{ matrix.windows-arch }} $GITHUB_WORKSPACE
        else
          cmake -DENABLE_CLILOADER=1 -DCMAKE_BUILD_TYPE=$BUILD_TYPE                               $GITHUB_WORKSPACE
        fi

    - name: Build
      working-directory: ./build
      shell: bash
      run: cmake --build . --parallel --config $BUILD_TYPE --target package

    - name: Upload Package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: package-${{ matrix.os }}${{ matrix.windows-arch && format('-{0}', matrix.windows-arch) || '' }}
        path: |
          ./build/clintercept-*.zip
          ./build/clintercept-*.tar.gz
        if-no-files-found: error

  # Sign and release on Linux, since the signing tools do not install on Windows on Arm.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
    - name: Download Packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: package-*
        path: ./packages
        merge-multiple: true

    - name: Sign
      uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 #v3.5.0
      with:
        inputs: |
          ./packages/clintercept-*

    - name: Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        draft: true
        files: |
          ./packages/clintercept-*
